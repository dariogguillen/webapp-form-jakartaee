<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario de usuarios</title>
</head>
<body>
<h3>Formulario de usuario</h3>
<form action="/webapp-form/registro" method="post">
    <div>
        <label for="username">Usuario</label>
        <div><input type="text" name="username" id="username"></div>
    </div>
    <div>
        <label for="password">Contraseña</label>
        <div><input type="password" name="password" id="password"></div>
    </div>
    <div>
        <label for="email">Email</label>
        <div><input type="text" name="email" id="email"></div>
    </div>
    <div>
        <label for="pais">País</label>
        <div>
            <select name="pais" id="pais">
                <option value="">-- selccionar --</option>
                <option value="ES">España</option>
                <option value="MX">México</option>
                <option value="CL">Chile</option>
                <option value="AR">Argentina</option>
                <option value="PE">Perú</option>
                <option value="CO">Colombia</option>
                <option value="VE">Venezuela</option>
            </select>
        </div>
    </div>
    <div>
        <label for="lenguajes">Lenguajes de Progrmación</label>
        <div>
            <select name="lenguajes" id="lenguajes" multiple>
                <option value="java">Java SE</option>
                <option value="jakartaee">Jakarta EE</option>
                <option value="SP">Spring Boot</option>
                <option value="js">Javascript</option>
                <option value="angular">Angular</option>
                <option value="react">React</option>
            </select>
        </div>
    </div>
    <div>
        <label>Roles</label>
        <div>
            <input type="checkbox" name="roles" value="ROLE_ADMIN">
            <label>Administrador</label>
            <input type="checkbox" name="roles" value="ROLE_USER">
            <label>Usuario</label>
            <input type="checkbox" name="roles" value="ROLE_MODERATOR">
            <label>Moderador</label>
        </div>
    </div>
    <div>
        <div>
            <input type="submit" value="Enviar">
        </div>
    </div>
</form>
</body>
</html>
